<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheherazade's Lantern</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    color: #e0d8c8;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .hero {
    text-align: center;
    padding: 80px 20px 40px;
    background: linear-gradient(180deg, rgba(10,10,20,0) 0%, rgba(10,10,20,1) 100%);
  }
  .hero img { width: 300px; height: 300px; border-radius: 20px; box-shadow: 0 20px 60px rgba(255,215,0,0.15); }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: 2.5em;
    color: #ffd700;
    margin: 30px 0 10px;
    letter-spacing: 3px;
  }
  .tagline { color: #a09880; font-size: 1.1em; margin-bottom: 40px; }
  .episodes {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .episode {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    transition: all 0.3s ease;
  }
  .episode:hover { border-color: rgba(255,215,0,0.3); background: rgba(255,255,255,0.06); }
  .ep-number { color: #ffd700; font-size: 0.8em; font-weight: 600; letter-spacing: 2px; }
  .ep-title { font-size: 1.2em; font-weight: 600; margin: 4px 0 8px; }
  .ep-desc { color: #8a8070; font-size: 0.9em; line-height: 1.5; }
  .ep-chars { color: #c8b890; font-size: 0.8em; margin-top: 8px; }
  audio { width: 100%; margin-top: 12px; border-radius: 8px; }
  .footer {
    text-align: center;
    padding: 40px;
    color: #5a5040;
    font-size: 0.85em;
    border-top: 1px solid rgba(255,215,0,0.05);
};
  .donate {
    background: rgba(255,215,0,0.05);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 12px;
    padding: 24px;
    margin: 40px 0;
    text-align: center;
  }
  .donate h3 { color: #ffd700; margin-bottom: 12px; }
  .donate code {
    background: rgba(255,255,255,0.05);
    padding: 12px 20px;
    border-radius: 8px;
    display: inline-block;
    font-size: 0.85em;
    word-break: break-all;
    color: #c8b890;
  }
  .lang-switch {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 8px;
    padding: 8px 16px;
    color: #ffd700;
    text-decoration: none;
    font-size: 0.9em;
  }

</head>
<body>

<div style="text-align:right; padding: 16px 24px;">
  <a href="ar/" style="color:#ffd700; text-decoration:none; font-size:0.9em; border:1px solid rgba(255,215,0,0.2); border-radius:8px; padding:8px 16px;">🇸🇦 العربية</a>

<div class="hero">

  <h1>SHEHERAZADE'S LANTERN</h1>
  <p class="tagline">Ancient Tales, Rekindled for Modern Souls — Anime-Style Audio Drama</p>

<div class="episodes">
  <h2 style="color:#ffd700; margin-bottom:20px; font-family:'Cinzel',serif;">Episodes</h2>

  <div class="episode">
    <div class="ep-number">EPISODE 01</div>
    <div class="ep-title">The Map of the Moving Streets</div>
    <div class="ep-desc">Rashid the Mapmaker draws cities that change overnight. Yueya the astronomer discovers his maps match a sky that hasn't risen yet. Together they find the Brass City — built by King Solomon's djinn.</div>
    <div class="ep-chars">🎭 Rashid (Irish) · Yueya (British)</div>
    <audio controls src="audio/episodes/ep01_anime.mp3"></audio>
  </div>

  <div class="episode">
    <div class="ep-number">EPISODE 02</div>
    <div class="ep-title">The Spice of Forgotten Things</div>
    <div class="ep-desc">A city is forgetting itself. Karim meets Nadia the Spice Merchant, who offers him a taste of every life he never lived.</div>
    <div class="ep-chars">🎭 Nadia (American) · Karim (British)</div>
    <audio controls src="audio/episodes/ep02_anime.mp3"></audio>
  </div>

  <div class="episode">
    <div class="ep-number">EPISODE 03</div>
    <div class="ep-title">The Blade That Was Never Finished</div>
    <div class="ep-desc">A haunted swordsmith. A boy seeking revenge. An unfinished blade on the wall. Khalid keeps a secret that the forge fire cannot burn away.</div>
    <div class="ep-chars">🎭 Khalid (American deep voice)</div>
    <audio controls src="audio/episodes/ep03_anime.mp3"></audio>
  </div>

  <div class="episode">
    <div class="ep-number">EPISODE 04</div>
    <div class="ep-title">The Book of Things Never Said</div>
    <div class="ep-desc">Once a century, a door appears in the Caravanserai. Inside waits Dunyazad, Scheherazade's sister, with a book of blank pages that holds every unspoken truth.</div>
    <div class="ep-chars">🎭 Dunyazad (Indian ethereal) · Yueya (British)</div>
    <audio controls src="audio/episodes/ep04_anime.mp3"></audio>
  </div>

  <div class="episode">
    <div class="ep-number">EPISODE 05</div>
    <div class="ep-title">The Sand That Sang Twice</div>
    <div class="ep-desc">Deep in the Empty Quarter, Karim hears the dunes singing. Layla holds a single grain of sand that reveals what he has been searching for his entire life.</div>
    <div class="ep-chars">🎭 Layla (Australian) · Karim (British)</div>
    <audio controls src="audio/episodes/ep05_anime.mp3"></audio>
  </div>

  <p style="text-align:center; margin-top:30px;">
    <a href="podcast/podcast.xml" style="color:#ffd700;">📡 RSS Feed</a>

</div>

  <p>The Lantern Keeper · Sheherazade's Lantern</p>
